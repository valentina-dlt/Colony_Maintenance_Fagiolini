<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Colony Task Launchpad</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">Mouse colony maintenance</p>
        <h1>Colony Task Launchpad</h1>
      </div>
      <div class="header-actions">
        <button id="refreshButton" type="button" title="Refresh tasks">Refresh</button>
        <span id="lastUpdated" class="timestamp"></span>
        <span id="refreshSchedule" class="timestamp"></span>
      </div>
    </header>

    <main>
      <nav class="view-tabs" aria-label="Task views">
        <button class="view-tab active" type="button" data-view="all">All Tasks</button>
        <button class="view-tab" type="button" data-view="today">Today</button>
        <button class="view-tab" type="button" data-view="week">Week</button>
        <button class="view-tab" type="button" data-view="month">Month</button>
        <button class="view-tab" type="button" data-view="breeders">Breeders</button>
      </nav>

      <section class="summary-grid" aria-label="Task summary">
        <div class="metric overdue">
          <span id="overdueCount">0</span>
          <p>Overdue</p>
        </div>
        <div class="metric due">
          <span id="dueCount">0</span>
          <p>Due Now</p>
        </div>
        <div class="metric upcoming">
          <span id="upcomingCount">0</span>
          <p>Upcoming</p>
        </div>
        <div class="metric review">
          <span id="reviewCount">0</span>
          <p>Review</p>
        </div>
      </section>

      <section class="toolbar" aria-label="Filters">
        <label>
          Status
          <select id="statusFilter">
            <option value="open">Open</option>
            <option value="all">All</option>
            <option value="overdue">Overdue</option>
            <option value="due">Due Now</option>
            <option value="upcoming">Upcoming</option>
            <option value="done">Done</option>
          </select>
        </label>
        <label>
          Task
          <select id="taskFilter">
            <option value="all">All tasks</option>
            <option value="Ear tag">Ear tag</option>
            <option value="Wean">Wean</option>
            <option value="Wean info to spreadsheet">Wean info to spreadsheet</option>
            <option value="Adult missing tags">Adult missing tags</option>
            <option value="Pup ASO Injection 1">Pup ASO Injection 1</option>
            <option value="Pup ASO Injection 2">Pup ASO Injection 2</option>
            <option value="Plasma/Tissue Collection">Plasma/Tissue Collection</option>
          </select>
        </label>
        <label>
          Line
          <select id="lineFilter">
            <option value="all">All lines</option>
          </select>
        </label>
        <label class="sort-box">
          Sort
          <select id="sortSelect">
            <option value="due-asc">Due date asc</option>
            <option value="due-desc">Due date desc</option>
            <option value="dob-asc">DOB asc</option>
            <option value="dob-desc">DOB desc</option>
          </select>
        </label>
        <label class="search-box">
          Search
          <input id="searchInput" type="search" placeholder="Cage, line, note">
        </label>
      </section>

      <section id="calendarHeader" class="calendar-header hidden" aria-live="polite">
        <div>
          <p id="calendarKicker" class="eyebrow">Calendar</p>
          <h2 id="calendarTitle"></h2>
        </div>
        <div class="calendar-tools">
          <div class="calendar-mode" aria-label="Calendar display mode">
            <button class="mode-button active" type="button" data-calendar-mode="window">Task Windows</button>
            <button class="mode-button" type="button" data-calendar-mode="due">Due Dates Only</button>
          </div>
          <div class="calendar-legend">
            <span><b class="legend-dot overdue-dot"></b>Overdue</span>
            <span><b class="legend-dot due-dot"></b>Due</span>
            <span><b class="legend-dot upcoming-dot"></b>Upcoming</span>
            <span><b class="legend-dot review-dot"></b>Review</span>
            <span><b class="legend-dot experimental-dot"></b>Experimental</span>
          </div>
        </div>
      </section>

      <section id="todayView" class="today-view hidden" aria-label="Today's tasks"></section>

      <section id="calendarView" class="calendar-grid hidden" aria-label="Task calendar"></section>

      <section id="breedersView" class="breeders-view hidden" aria-label="Breeders"></section>

      <section id="tableView" class="task-table-wrap">
        <table>
          <thead>
            <tr>
              <th>Done</th>
              <th>State</th>
              <th>Task</th>
              <th>Cage</th>
              <th>Line</th>
              <th>Window</th>
              <th>Age</th>
              <th>Details</th>
            </tr>
          </thead>
          <tbody id="taskRows"></tbody>
        </table>
      </section>
    </main>

    <template id="taskRowTemplate">
      <tr>
        <td><input class="done-toggle" type="checkbox" aria-label="Mark task done"></td>
        <td><span class="state-pill"></span></td>
        <td class="task-name"></td>
        <td class="cage"></td>
        <td class="line"></td>
        <td class="window"></td>
        <td class="age"></td>
        <td class="details"></td>
      </tr>
    </template>

    <script src="sample-data.js?v=20260629-3"></script>
    <script src="app.js?v=20260629-3"></script>
  </body>
</html>
